<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ameen Ali, Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC107"/>
      <stop offset="1" stop-color="#02569B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="140" font-size="64" font-weight="700" fill="#FFFFFF">Ameen Ali</text>
    <text x="82" y="186" font-size="26" fill="#FFC107">Software Engineer</text>
    <text x="82" y="222" font-size="20" fill="#A7B3C7">Mobile · ERP · SaaS platforms · Systems analysis</text>
    <g transform="translate(82,252)" font-size="16" fill="#E6EDF7">
      <rect x="0" y="-22" width="92" height="32" rx="16" fill="#02569B"/><text x="46" y="0" text-anchor="middle">Flutter</text>
      <rect x="104" y="-22" width="78" height="32" rx="16" fill="#3776AB"/><text x="143" y="0" text-anchor="middle">Python</text>
      <rect x="194" y="-22" width="74" height="32" rx="16" fill="#41B883"/><text x="231" y="0" text-anchor="middle">Vue.js</text>
      <rect x="280" y="-22" width="98" height="32" rx="16" fill="#0089FF"/><text x="329" y="0" text-anchor="middle">Frappe</text>
      <rect x="390" y="-22" width="62" height="32" rx="16" fill="#777BB4"/><text x="421" y="0" text-anchor="middle">PHP</text>
    </g>
  </g>
  <g transform="translate(900,70)">
    <circle cx="110" cy="90" r="96" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="110" cy="90" r="80" fill="#0E1A2E"/>
    <text x="110" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#FFC107">AA</text>
  </g>
</svg>
